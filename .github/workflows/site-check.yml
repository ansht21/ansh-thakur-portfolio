name: Site integrity check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (for the og:image dimension check)
        run: python -m pip install --quiet Pillow

      - name: Validate assets, canonical URL, OG tags and privacy
        run: python scripts/check_site.py
