image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html public/
    - cp styles.css public/
    - cp script.js public/
    - cp -r images/ public/images/
    - cp Analyst_Resume.pdf public/ 2>/dev/null || true
    - cp Ansh_Thakur_Resume.docx public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  only:
    - main
